[project]
name = "backend"
version = "0.1.0"
description = "Noesis Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # 核心后端包（import noesis）
    "noesis-core",
    # API / 持久化
    "alembic>=1.18.5",
    "asyncpg>=0.30.0",
    "bcrypt>=5.0.0",
    "cryptography>=48.0.0",
    "fastapi>=0.120.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "loguru>=0.7.3",
    "mcp>=1.19.0",
    "pydantic-validation-decorator>=0.1.5",
    "pyjwt>=2.10.1",
    "psycopg[binary,pool]>=3.2.0",
    "pyyaml>=6.0",
    "sqlalchemy[asyncio]>=2.0.44",
    # KB 层直接依赖（非经 noesis 间接引入）
    "langchain-core",
    "langchain-community",
    "langchain-openai",
    "langchain-mcp-adapters>=0.1.11",
    "langchain-text-splitters",
    # 知识库 / DeepDoc / RAG
    "beartype>=0.18.0",
    "chardet>=5.2.0",
    "huggingface-hub>=0.26.0",
    "jieba>=0.42.1",
    "markdown>=3.6",
    "markitdown[docx]>=0.0.1",
    "numpy>=2.2.6",
    "openai>=2.7.1",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "pdfplumber>=0.10.4",
    "pypdf>=5.0.0",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "qdrant-client>=1.18.0",
    "rank-bm25>=0.2.2",
    # 可观测
    "langfuse>=3.10.0,<4",
    "croniter>=6.2.4",
]

[project.optional-dependencies]
# DeepDoc PDF 版面识别/OCR/表格结构重栈（cv2+onnxruntime+sklearn+xgboost
# 及其传递依赖 scipy/sympy ≈ 390MB）。未安装时 PDF 自动降级 pdfplumber
# 纯文本抽取（deepdoc_service._parse_pdf 回退），其余格式不受影响。
# 生产镜像默认不装（uv sync 不带 --extra）；本地经 dev group 默认安装。
deepdoc-pdf = [
    "onnxruntime>=1.19.0",
    "opencv-python-headless>=4.10.0.84",
    "scikit-learn>=1.5.0",
    "xgboost>=2.0.0",
]
# 飞书通道 SDK（≈95MB）。messaging.feishu_runtime_enabled=true 时才需要；
# 未安装且未启用时启动优雅跳过。
feishu = [
    "lark-oapi>=1.5.3,<2",
]
# 压测（backend/evals/loadtest）
loadtest = [
    "locust>=2.31.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    # 本地 Agent CLI（评测用，直调 Agent，不走 HTTP）——生产镜像不装
    "noesis-cli",
    # 本地默认全功能：DeepDoc PDF 重栈与飞书 SDK（生产镜像经
    # optional-dependencies 按需安装，此处保证 uv run 默认可用）
    "onnxruntime>=1.19.0",
    "opencv-python-headless>=4.10.0.84",
    "scikit-learn>=1.5.0",
    "xgboost>=2.0.0",
    "lark-oapi>=1.5.3,<2",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
noesis-core = { path = "packages/noesis-core", editable = true }
noesis-cli = { path = "packages/noesis-cli", editable = true }


[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# 默认跳过 integration（真实 LLM / 外部服务），需手动 `-m integration` 或设环境变量开启
addopts = "-m 'not integration'"
markers = [
    "integration: marks tests that call real LLM or external services",
]
