[project]
name = "backend"
version = "0.1.0"
description = "Noesis Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Agent harness（内含 noesis.llm；禁止 noesis→services 反向依赖）
    "noesis-harness",
    # 本地 harness CLI（评测用，直调 Agent，不走 HTTP）
    "noesis-cli",
    # API / 持久化
    "alembic>=1.18.5",
    "asyncpg>=0.30.0",
    "bcrypt>=5.0.0",
    "cryptography>=48.0.0",
    "fastapi>=0.120.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "loguru>=0.7.3",
    "mcp>=1.19.0",
    "pydantic-validation-decorator>=0.1.5",
    "pyjwt>=2.10.1",
    "psycopg[binary,pool]>=3.2.0",
    "pyyaml>=6.0",
    "sqlalchemy[asyncio]>=2.0.44",
    # KB 层直接依赖（非经 noesis 间接引入）
    "langchain-core",
    "langchain-community",
    "langchain-openai",
    "langchain-mcp-adapters>=0.1.11",
    "langchain-text-splitters",
    # 知识库 / DeepDoc / RAG
    "beartype>=0.18.0",
    "chardet>=5.2.0",
    "huggingface-hub>=0.26.0",
    "jieba>=0.42.1",
    "markdown>=3.6",
    "markitdown[docx]>=0.0.1",
    "numpy>=2.2.6",
    "onnxruntime>=1.19.0",
    "opencv-python-headless>=4.10.0.84",
    "openai>=2.7.1",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "pdfplumber>=0.10.4",
    "pypdf>=5.0.0",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "qdrant-client>=1.18.0",
    "rank-bm25>=0.2.2",
    "scikit-learn>=1.5.0",
    "xgboost>=2.0.0",
    # 可观测
    "langfuse>=3.10.0,<4",
    "croniter>=6.2.4",
    "lark-oapi>=1.5.3,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
noesis-harness = { path = "packages/harness", editable = true }
noesis-cli = { path = "packages/noesis-cli", editable = true }

[project.optional-dependencies]
loadtest = [
    "locust>=2.31.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# 默认跳过 integration（真实 LLM / 外部服务），需手动 `-m integration` 或设环境变量开启
addopts = "-m 'not integration'"
markers = [
    "integration: marks tests that call real LLM or external services",
]
