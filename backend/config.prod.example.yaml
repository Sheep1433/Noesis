# 生产裸机运行时配置（复制为 config.prod.yaml）
# 密钥见 backend/.env.prod

config_version: 1

app:
  name: Noesis-FastAPI
  root_path: ""
  host: 0.0.0.0
  port: 8089
  version: 1.0.0
  reload: false

session:
  idle_expire_days: 30
  absolute_expire_days: 90
  renewal_window_minutes: 5
  cookie_name: noesis_session

database:
  host: 127.0.0.1
  port: 5432
  user: noesis
  database: noesis
  echo: false
  max_overflow: 10
  pool_size: 50
  pool_recycle: 3600
  pool_timeout: 30

model:
  type: openai
  name: deepseek-v4-flash
  temperature: 0.75
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  show_thinking_process: true
  # OpenCode Zen 免费模型示例（改 type/name/base_url；.env MODEL_API_KEY=public）：
  # type: opencode
  # name: deepseek-v4-flash-free
  # base_url: https://opencode.ai/zen/v1
  # default_catalog_id: flash
  # catalog:
  #   - id: flash
  #     label: DeepSeek V4 Flash（快速）
  #     name: deepseek-v4-flash-free
  #   - id: big-pickle
  #     label: Big Pickle（推理）
  #     name: big-pickle
  #   - id: mimo
  #     label: MiMo V2.5（小米）
  #     name: mimo-v2.5-free
  #   - id: nemotron
  #     label: Nemotron 3 Ultra（1M 上下文）
  #     name: nemotron-3-ultra-free
  #   - id: north
  #     label: North Mini Code（代码）
  #     name: north-mini-code-free

  # --- DeepSeek 官方直连（需 .env DEEPSEEK_API_KEY）---
  # type: deepseek
  # name: deepseek-v4-flash
  # temperature: 0.75
  # base_url: https://api.deepseek.com/v1

  # --- 阿里云 DashScope Qwen（需 .env DASHSCOPE_API_KEY）---
  # type: qwen
  # name: qwen-plus
  # temperature: 0.75
  # base_url: https://dashscope.aliyuncs.com/compatible-mode/v1

  # --- Anthropic 官方或中转（需 .env ANTHROPIC_API_KEY）---
  # type: anthropic
  # name: claude-haiku-4-5-20251001
  # temperature: 0.75
  # base_url: https://api.anthropic.com          

  # --- 多 provider catalog 切换示例 ---
  # default_catalog_id: deepseek-flash
  # catalog:
  #   - id: deepseek-flash
  #     label: DeepSeek V4 Flash（官方）
  #     type: deepseek
  #     name: deepseek-v4-flash
  #     base_url: https://api.deepseek.com/v1
  #     context_window: 200000
  #   - id: qwen-plus
  #     label: Qwen Plus（DashScope）
  #     type: qwen
  #     name: qwen-plus
  #     base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  #     context_window: 129024
  #   - id: claude-haiku
  #     label: Claude Haiku 4.5
  #     type: anthropic
  #     name: claude-haiku-4-5-20251001
  #     base_url: https://api.anthropic.com
  #     context_window: 200000

  request_timeout: 120
  max_retries: 2
  generation:
    max_tokens: 32000
    top_p: 0.8
    frequency_penalty: 0.0
    presence_penalty: 0.0
    streaming: true

embedding:
  name: text-embedding-v4
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1

rerank:
  name: gte-rerank-v2
  # 精排走 DashScope text-rerank API；密钥默认复用 .env.prod 中 EMBEDDING_MODEL_API_KEY
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1

vlm:
  name: Qwen3-VL-32B-Instruct
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1

context:
  max_input_tokens: 0
  display_enabled: true

summarization:
  enabled: true
  # 仅 model_name 单独配置；type / base_url / api_key 与 model 层一致
  model_name: ""
  temperature: 0.0
  # 触发压缩：trigger_tokens > 0 时用绝对 token 阈值；为 0 时用 trigger_fraction × catalog limit.context
  trigger_tokens: 0
  trigger_fraction: 0.75
  # 可选摘要窗口覆盖值；0 表示使用 model catalog 的 limit.context
  max_input_tokens: 0
  # model profile 不可用时的消息数量 fallback
  messages_to_keep: 28

agent_runtime:
  tool_output_max_chars: 24000
  governor:
    tool_calls_enabled: true
    tool_calls_total: null
    tool_calls_per_name: 10
    loop_enabled: true
    loop_hard_limit: 5
    loop_window_size: 20

stream:
  sse_keepalive_interval_seconds: 25
  checkpoint_interval_seconds: 2
  persistence_timeout_seconds: 5
  persistence_retry_interval_seconds: 0.25
  run_event_buffer_max_events: 2000
  run_event_buffer_max_bytes: 4194304
  run_subscriber_queue_max_events: 512
  run_subscriber_queue_max_bytes: 1048576
  run_max_active: 100
  run_max_active_per_user: 4
  run_max_subscriptions_per_run: 8
  run_max_subscriptions_per_user: 16
  run_max_subscriptions_global: 500
  run_terminal_retention_seconds: 300
  run_max_duration_seconds: 900
  run_max_output_bytes: 67108864
  run_hitl_pending_timeout_seconds: 86400
  run_shutdown_drain_seconds: 10
  run_cancel_grace_seconds: 2
  run_terminal_persistence_budget_seconds: 5
  run_terminal_retry_interval_seconds: 5
  run_tool_timeout_seconds: 120
  run_channel_queue_max_batches: 128
  run_channel_queue_max_bytes: 1048576
  run_channel_drain_seconds: 5

messaging:
  # Telegram long-poll 真收发；默认关。多 worker 勿同时开以免重复 getUpdates
  telegram_runtime_enabled: false
  telegram_poll_timeout_seconds: 25
  feishu_runtime_enabled: false

settings_features:
  provider_models: false
  mcp_management: false
  automation_operations: false
  channel_operations: false
  agent_context: false
  observability: false
  import_export: false

qdrant:
  host: 127.0.0.1
  port: 6333
  timeout: 5
  grpc_port: 6334
  prefer_grpc: false
  default_collection: knowledge_base
  requirement_docs_collection: requirement_docs
  test_case_docs_collection: test_case_docs
  test_case_upload_collection: ""
  case_rag_historical_requirements_enabled: false

langfuse:
  tracing_enabled: false
  base_url: http://127.0.0.1:3000

other:
  skills_filesystem_root: ""  # 空则默认 extensions/skills；可填绝对路径或相对仓库根的路径
  mcp_config_path: ""  # 空则默认 extensions/mcp/mcp.json

# Skills 市场（skills.sh 搜索 + GitHub 安装到个人 skills）
skills_market:
  provider: skills_sh
  base_url: https://skills.sh
  search_timeout_seconds: 15
  github_timeout_seconds: 60
  cache_ttl_seconds: 3600
  preview_cache_ttl_seconds: 86400
  max_archive_bytes: 52428800

# LangGraph Agent checkpoint（独立 PostgreSQL 数据库）
checkpoint:
  database: noesis_langgraph

# Web 检索工具（COMMON_QA / SUPER_AGENT_QA；TAVILY_API_KEY 见 .env.prod）
web_tools:
  max_search_results: 8
  fetch_max_chars: 4096
  fetch_timeout_seconds: 30
  ddg_backends: mojeek,yandex

# Agent 沙箱（深度研究 / 故障运维）
# backend: docker（推荐 slim 镜像 + docker exec）| local_shell（宿主机）
sandbox:
  backend: docker
  runner_url: http://127.0.0.1:8090
  execute_timeout_seconds: 120

# SuperAgent HITL（默认关闭）；ask_timeout_seconds=86400（24h）
hitl:
  enabled: false
  ask_timeout_seconds: 86400

# 知识库 DeepDoc（ONNX 权重需单独下载，见 backend/kb/README.md）
kb:
  deepdoc:
    enabled: true
    model_dir: ../.noesis/rag/res/deepdoc
  parser:
    default: deepdoc

# 聊天会话附件（COMMON_QA；敏感项无）
chat_attachment:
  enabled: true
  ttl_days: 7
  max_file_mb: 20
  auto_convert: true
  max_image_mb: 5
  vision_enabled: true
  reinject_session_images: true
  max_files_per_message: 10
  image_inject_max_edge: 1536
  vlm_fallback_enabled: true
  tiny_inline_chars: 4096
  read_page_lines: 2000
  preview_chars: 500
