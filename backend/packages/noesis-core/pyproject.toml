[project]
name = "noesis-core"
version = "0.1.0"
description = "Noesis core backend — agents, services, knowledge, and storage"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.30.0",
    "bcrypt>=5.0.0",
    "croniter>=6.2.4",
    "cryptography>=48.0.0",
    "deepagents==0.6.12",
    "fastapi>=0.120.0",
    "langchain==1.3.15",
    "langchain-community>=0.4",
    "langchain-anthropic>=1.0.0",
    "langchain-deepseek>=1.0.1",
    "langchain-mcp-adapters>=0.1.11",
    "langchain-openai>=1.0.2",
    "langchain-qwq>=0.3.5",
    "langchain-text-splitters>=1.0.0",
    "langgraph==1.2.11",
    "langfuse>=3.10.0,<4",
    "lark-oapi>=1.5.3,<2",
    "httpx>=0.27.0",
    "jieba>=0.42.1",
    "loguru>=0.7.0",
    "markitdown[pdf,docx,pptx]>=0.1.4",
    "mcp>=1.19.0",
    "openai>=2.8.0",
    "pillow>=10.0.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "psycopg-pool>=3.2.0",
    "psycopg[binary,pool]>=3.2.0",
    "python-docx>=1.2.0",
    "qdrant-client>=1.18.0",
    "sqlalchemy[asyncio]>=2.0.44",
    "tavily-python>=0.5.0",
    "ddgs>=9.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/noesis"]
