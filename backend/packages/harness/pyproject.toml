[project]
name = "noesis-harness"
version = "0.1.0"
description = "Noesis Agent harness — factory, profiles, backends, tools (no Delivery/HTTP)"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.6.7",
    "langchain>=1.0.2",
    "langchain-community>=0.4",
    "langchain-deepseek>=1.0.1",
    "langchain-mcp-adapters>=0.1.11",
    "langchain-openai>=1.0.2",
    "langchain-qwq>=0.3.5",
    "langgraph>=1.0.1",
    "langfuse>=3.10.0,<4",
    "httpx>=0.27.0",
    "loguru>=0.7.0",
    "mcp>=1.19.0",
    "pillow>=10.0.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "psycopg-pool>=3.2.0",
    "tavily-python>=0.5.0",
    "ddgs>=9.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["noesis"]
