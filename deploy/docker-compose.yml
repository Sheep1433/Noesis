# Noesis 生产栈：nginx + backend + qdrant + sandbox-runner
# 在仓库根目录执行: docker compose -f deploy/docker-compose.yml --env-file deploy/.env.docker up -d
#
# 关键：NOESIS_HOST_DATA_DIR / NOESIS_HOST_SKILLS_DIR 必须是 Docker **宿主机**绝对路径。
# runner 把这两个路径原样交给 daemon 做 bind；同时以相同路径挂进 runner，便于 mkdir。
# 示例（仓库根开发）:
#   NOESIS_HOST_DATA_DIR=/absolute/path/to/Noesis/.noesis
#   NOESIS_HOST_SKILLS_DIR=/absolute/path/to/Noesis/extensions/skills
#
# 构建 slim: docker build -t noesis/sandbox-slim:latest -f deploy/sandbox-slim/Dockerfile .

name: ${COMPOSE_PROJECT_NAME:-noesis}

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-noesis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DATABASE:-noesis}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/10-create-langgraph-db.sql:ro
    # 宿主机 5433，避免 POSTGRES_PORT 经 env_file 泄漏进 backend 覆盖容器内 5432
    # 只绑 127.0.0.1：公网暴露依赖云安全组单层防线，此处收敛为第二道防线
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 30s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - qdrant_storage:/qdrant/storage

  sandbox-runner:
    build:
      context: ..
      dockerfile: deploy/sandbox-runner/Dockerfile
    restart: unless-stopped
    environment:
      SANDBOX_RUNNER_TOKEN: ${SANDBOX_RUNNER_TOKEN:-}
      SANDBOX_RUNTIME: docker
      SANDBOX_DOCKER_IMAGE: ${SANDBOX_DOCKER_IMAGE:-noesis/sandbox-slim:latest}
      # 必须是宿主机绝对路径（daemon bind source）
      NOESIS_HOST_DATA_DIR: ${NOESIS_HOST_DATA_DIR:?Set NOESIS_HOST_DATA_DIR to absolute host path}
      SANDBOX_SKILLS_HOST_DIR: ${NOESIS_HOST_SKILLS_DIR:?Set NOESIS_HOST_SKILLS_DIR to absolute host skills path}
      SANDBOX_MAX_REPLICAS: "20"
      SANDBOX_IDLE_TTL_SECONDS: "259200"
      SANDBOX_REAP_INTERVAL_SECONDS: "3600"
      SANDBOX_UID: "10001"
      SANDBOX_GID: "10001"
      SANDBOX_MEM_LIMIT: "512m"
      SANDBOX_PIDS_LIMIT: "256"
    volumes:
      # 路径字符串与宿主机一致，避免「容器内路径冒充 host bind」
      - ${NOESIS_HOST_DATA_DIR}:${NOESIS_HOST_DATA_DIR}
      - ${NOESIS_HOST_SKILLS_DIR}:${NOESIS_HOST_SKILLS_DIR}:ro
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8090/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - default

  # Run bus（Pub/Sub 在线广播，at-most-once）：无权威状态、无需持久化；
  # 仅 NOESIS_RUN_BUS_BACKEND=redis 时被 backend 使用
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - default

  # worker-role-split 三角色：web（HTTP 面，可 scale）/ control（×1，
  # advisory lock 防双开）/ worker（认领执行面，可 scale）。
  # 三者共用 backend 镜像，仅 command 不同；bus 强制 redis。
  web:
    build:
      context: ..
      dockerfile: deploy/backend/Dockerfile
    restart: unless-stopped
    command: ["python", "web.py"]
    env_file:
      - .env.docker
    environment: &backend_env
      NOESIS_CONFIG_PATH: /app/config.yaml
      NOESIS_DATA_DIR: /data/noesis
      NOESIS_RUN_BUS_BACKEND: redis
      SANDBOX_RUNNER_URL: http://sandbox-runner:8090
      SANDBOX_RUNNER_TOKEN: ${SANDBOX_RUNNER_TOKEN:-}
      SANDBOX_SKIP_DOCKER_CHECK: "1"
    volumes: &backend_volumes
      - ./config.docker.yaml:/app/config.yaml:ro
      - ${NOESIS_HOST_DATA_DIR}:/data/noesis
      - ${NOESIS_HOST_SKILLS_DIR}:/app/extensions/skills:ro
      - backend_runtime:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: &backend_depends
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      sandbox-runner:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck: &backend_health
      # 瘦身镜像不装 curl；compose 级 healthcheck 用 python
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8089/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  control:
    build:
      context: ..
      dockerfile: deploy/backend/Dockerfile
    restart: unless-stopped
    command: ["python", "control.py"]
    env_file:
      - .env.docker
    environment: *backend_env
    volumes: *backend_volumes
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: *backend_depends
    healthcheck:
      <<: *backend_health
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8091/health', timeout=4).status == 200 else 1)"]

  worker:
    build:
      context: ..
      dockerfile: deploy/backend/Dockerfile
    restart: unless-stopped
    command: ["python", "worker.py"]
    env_file:
      - .env.docker
    environment: *backend_env
    volumes: *backend_volumes
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: *backend_depends
    healthcheck:
      <<: *backend_health
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8092/health', timeout=4).status == 200 else 1)"]

  # 扩容执行面：docker compose up -d --scale worker=3（认领分片，容量线性）；
  # web 同理 --scale web=2（nginx 经 Docker DNS 轮询）
  nginx:
    build:
      context: ..
      dockerfile: deploy/frontend/Dockerfile
    restart: unless-stopped
    ports:
      # 宿主机 nginx 经 127.0.0.1 反代进入；不对外直接暴露容器端口
      - "127.0.0.1:${NOESIS_HTTP_PORT:-28468}:80"
    depends_on:
      web:
        condition: service_healthy

networks:
  default:
    name: ${COMPOSE_PROJECT_NAME:-noesis}_default

volumes:
  postgres_data:
  qdrant_storage:
  backend_runtime:
