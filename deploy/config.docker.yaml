# Docker Compose 运行时配置（无密钥；挂载到容器 /app/config.yaml）

config_version: 1

app:
  name: Noesis-FastAPI
  root_path: ""
  host: 0.0.0.0
  port: 8089
  version: 1.0.0
  reload: false

session:
  idle_expire_days: 30
  absolute_expire_days: 90
  renewal_window_minutes: 5
  cookie_name: noesis_session

database:
  host: postgres
  port: 5432
  user: noesis
  database: noesis
  echo: false
  max_overflow: 10
  pool_size: 50
  pool_recycle: 3600
  pool_timeout: 30

model:
  type: openai
  name: kilo-auto/free
  temperature: 0.75
  base_url: https://api.kilo.ai/api/gateway
  # kilo 免费模型当前不校验 Key（未文档化行为，失效仅影响默认链路）；
  # 稳妥做法：kilo.ai 免费注册拿 Key 放 .env MODEL_API_KEY（env 优先于 yaml）
  api_key: public
  show_thinking_process: true
  # 用户自建 Provider 的平台预设（部署者维护；选预设 → base_url 自动填，用户只填 Key）
  # 敏感凭证不放预设；归因类 header 可放
  provider_presets:
    - id: deepseek
      label: deepseek
      base_url: https://api.deepseek.com/v1
    - id: qwen
      label: alibaba
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    - id: minimax
      label: minimax
      base_url: https://api.minimax.chat/v1

  # 目录只保留部署默认模型（开箱可用 + 服务端内部 LLM 任务的底座）；
  # 免费模型会轮换，其余在设置页「获取可用模型」按当下真实列表勾选添加
  default_catalog_id: kilo-auto/free
  catalog:
    - id: kilo-auto/free
      label: Kilo Auto
      context_window: 256000
  request_timeout: 120
  max_retries: 2
  generation:
    max_tokens: 32000
    top_p: 0.8
    frequency_penalty: 0.0
    presence_penalty: 0.0
    streaming: true

embedding:
  name: text-embedding-v4
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1

rerank:
  name: gte-rerank-v2
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1

vlm:
  name: Qwen3-VL-32B-Instruct
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1

context:
  max_input_tokens: 0
  display_enabled: true

summarization:
  enabled: true
  model_name: ""
  temperature: 0.0
  trigger_tokens: 96000
  trigger_fraction: 0.75
  max_input_tokens: 0
  tool_offload_threshold: 6000
  max_retention_ratio: 0.65
  messages_to_keep: 28

agent_runtime:
  tool_output_max_chars: 24000
  read_file_max_chars: 20000
  # Run Governor：统一模型/工具/子 Agent 预算与循环检测
  governor:
    tool_calls_enabled: true
    tool_calls_total: null
    tool_calls_per_name: 10
    loop_enabled: true
    loop_hard_limit: 5
    loop_window_size: 20

distributed_runs:
  # 模式（memory|redis）、REDIS_URL、NOESIS_CLUSTER_ID 属环境项，只在 .env 显式配置：
  #   NOESIS_RUN_BUS_BACKEND=memory|redis（必填，无默认）
  #   REDIS_URL / NOESIS_CLUSTER_ID（backend=redis 时必填）
  leader_heartbeat_seconds: 30
  queued_scan_interval_seconds: 5
  command_scan_interval_seconds: 5
  publisher_queue_max_events: 512
  publisher_queue_max_bytes: 1048576
  handshake_buffer_max_events: 256
  handshake_buffer_max_bytes: 524288
  reconciliation_interval_seconds: 30
  periodic_checkpoint_interval_seconds: 15
  envelope_payload_max_bytes: 262144
  redis_socket_timeout_seconds: 5
  redis_connect_timeout_seconds: 3
  redis_pool_max_connections: 20

stream:
  sse_keepalive_interval_seconds: 25
  checkpoint_interval_seconds: 2
  persistence_timeout_seconds: 5
  persistence_retry_interval_seconds: 0.25
  run_event_buffer_max_events: 2000
  run_event_buffer_max_bytes: 4194304
  run_subscriber_queue_max_events: 512
  run_subscriber_queue_max_bytes: 1048576
  run_max_active: 100
  run_max_active_per_user: 4
  run_terminal_retention_seconds: 300
  run_max_duration_seconds: 900
  run_max_output_bytes: 67108864
  run_hitl_pending_timeout_seconds: 86400
  run_shutdown_drain_seconds: 10
  run_cancel_grace_seconds: 2
  run_tool_timeout_seconds: 120
  run_channel_queue_max_batches: 128
  run_channel_queue_max_bytes: 1048576
  run_channel_drain_seconds: 5

qdrant:
  host: qdrant
  port: 6333
  timeout: 5
  grpc_port: 6334
  prefer_grpc: false
  default_collection: knowledge_base
  requirement_docs_collection: requirement_docs
  test_case_docs_collection: test_case_docs
  test_case_upload_collection: ""
  case_rag_historical_requirements_enabled: false

langfuse:
  tracing_enabled: true
  base_url: http://host.docker.internal:8888

other:
  skills_filesystem_root: ""  # 空则默认 extensions/skills（Docker 镜像内为 /app/extensions/skills）
  mcp_config_path: ""  # 空则默认 extensions/mcp/mcp.json

# Skills 市场（skills.sh 搜索 + GitHub 安装到个人 skills）
skills_market:
  provider: skills_sh
  base_url: https://skills.sh
  search_timeout_seconds: 15
  github_timeout_seconds: 60
  cache_ttl_seconds: 3600
  preview_cache_ttl_seconds: 86400
  max_archive_bytes: 52428800

# 容器内路径基于 /app（backend/）；持久化见 docker-compose backend_runtime 卷
checkpoint:
  database: noesis_langgraph

chat_attachment:
  enabled: true
  ttl_days: 7
  max_file_mb: 20
  auto_convert: true
  max_image_mb: 5
  vision_enabled: true
  reinject_session_images: true
  max_files_per_message: 10
  image_inject_max_edge: 1536
  vlm_fallback_enabled: true
  tiny_inline_chars: 4096
  read_page_lines: 2000
  preview_chars: 500

# Web 检索工具（COMMON_QA / SUPER_AGENT_QA；TAVILY_API_KEY 见 deploy/.env.docker）
web_tools:
  max_search_results: 8
  fetch_max_chars: 16000
  fetch_timeout_seconds: 30
  ddg_backends: mojeek,yandex

# Agent 沙箱（深度研究 / 故障运维）
# backend: docker（slim + docker exec）| local_shell（宿主机；aio 已移除）
# runner / 宿主机路径见 deploy/docker-compose.yml（NOESIS_HOST_DATA_DIR）
sandbox:
  backend: docker
  runner_url: http://sandbox-runner:8090
  execute_timeout_seconds: 120

# SuperAgent HITL（默认关闭）；ask_timeout_seconds=86400（24h）
hitl:
  enabled: false
  ask_timeout_seconds: 86400

# 外部通讯通道；多副本部署只在一个 backend 实例开启轮询/长连接
messaging:
  telegram_runtime_enabled: false
  telegram_poll_timeout_seconds: 25
  feishu_runtime_enabled: false

# 知识库 DeepDoc（权重挂载至 noesis_data:/data/noesis/rag/res/deepdoc）
# md 文件记忆层（索引 + 五类条目 + 情景日志）；功能启停由每个用户的单一开关控制。
memory:
  extraction_model: ""       # 空 = 默认对话模型（会话终态抽取）
  selection_model: ""        # 空 = 默认对话模型（每 Run 注入选条）
  enabled_by_default: false  # fail-closed：评测门禁未过不默认开启
  session_idle_minutes: 10
  sweep_interval_minutes: 30
  max_entries_per_extraction: 3
  index_max_lines: 200
  index_max_bytes: 25600
  stale_warning_days: 2
  inject_budget_tokens: 2000
  max_entry_chars: 4000
  consolidation_min_interval_hours: 24
  consolidation_min_new_sessions: 5
  max_message_chars: 120000

kb:
  deepdoc:
    enabled: true
    model_dir: /data/noesis/rag/res/deepdoc
  parser:
    default: deepdoc
